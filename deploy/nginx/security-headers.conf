# Shared security headers for V-Portal (ARV).
#
# Install to: /etc/nginx/snippets/arv-security-headers.conf
#
# Nginx has a well-known gotcha: any `add_header` inside a `location` block
# REPLACES all `add_header` directives inherited from the enclosing `server`
# block. That is why this snippet is `include`d in the server block *and* in
# every location that declares its own `add_header` (e.g. Cache-Control), so
# the security headers are never silently dropped.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(), usb=()" always;

# Content-Security-Policy.
# NOTE: the admin UI and the AR viewer rely on inline <script>/<style> and on
# CDN-hosted libraries (Alpine.js, htmx, Three.js/MindAR), so 'unsafe-inline'
# and 'unsafe-eval' are required today. Tightening this further requires
# moving inline scripts to nonce/hash-based loading first.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
