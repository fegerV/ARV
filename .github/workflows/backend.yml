name: Backend (tests, lint)

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "tests/**"
      - "templates/**"
      - "alembic/**"
      - "scripts/**"
      - "pytest.ini"
      - "requirements*.txt"
      - ".env.test"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "app/**"
      - "tests/**"
      - "templates/**"
      - "alembic/**"
      - "scripts/**"
      - "pytest.ini"
      - "requirements*.txt"
      - ".env.test"
      - ".github/workflows/backend.yml"

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Source .env.test rather than repeating its values here: the committed
      # test env also pins the backup/DR switches, and CI inheriting the
      # defaults instead was exactly the drift .env.test exists to prevent.
      - name: Run migrations
        run: |
          set -a
          . ./.env.test
          set +a
          alembic upgrade head

      - name: Run tests
        run: bash scripts/run_tests.sh -q --tb=short

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # ARV-016: keep a dependency-vulnerability gate in CI. ``--strict`` makes
      # the job fail on any known vulnerability in the pinned requirements so a
      # vulnerable transitive dependency cannot land on main unnoticed.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check app/ tests/ --output-format=github
        continue-on-error: true
